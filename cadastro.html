<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pensionato Pro - Cadastro de Administrador</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-body">
    <div class="auth-card">
        <div class="auth-header">
            <div class="brand">Criar <span class="brand-highlight">Administrador</span></div>
            <p>Cadastre um novo proprietário no sistema</p>
        </div>
        
        <form id="form-register" onsubmit="handleRegister(event)" class="auth-form">
            <div class="form-group">
                <label for="reg-name">Nome Completo</label>
                <input type="text" id="reg-name" required placeholder="Ex: Victor Barcelos" class="form-control">
            </div>

            <div class="form-group">
                <label for="reg-user">Usuário / E-mail</label>
                <input type="text" id="reg-user" required placeholder="seu@email.com" class="form-control">
            </div>
            
            <div class="form-group">
                <label for="reg-pass">Senha de Acesso</label>
                <input type="password" id="reg-pass" required placeholder="••••••••" class="form-control">
            </div>

            <div id="reg-error" style="display:none; color:var(--danger); font-size:0.8rem; font-weight:bold; margin-bottom:0.75rem; text-align:center;">
                Erro ao cadastrar usuário. Tente outro e-mail!
            </div>

            <button type="submit" class="btn-primary" style="width:100%; justify-content:center; padding:0.75rem;">Cadastrar</button>
            
            <div style="text-align:center; margin-top:1.25rem;">
                <a href="login.html" style="color:var(--primary); text-decoration:none; font-size:0.85rem; font-weight:600;">Já possui conta? Voltar ao Login</a>
            </div>
        </form>
    </div>

    <script src="js/state.js"></script>
    <script>
        async function handleRegister(e) {
            e.preventDefault();
            const name = document.getElementById('reg-name').value.trim();
            const user = document.getElementById('reg-user').value.trim();
            const pass = document.getElementById('reg-pass').value.trim();
            const errorDiv = document.getElementById('reg-error');

            const success = await DBService.registerUser(name, user, pass);
            if (success) {
                alert("Usuário cadastrado com sucesso! Faça login para continuar.");
                window.location.href = 'login.html';
            } else {
                errorDiv.style.display = 'block';
            }
        }
    </script>
</body>
</html>
