<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quartos Disponíveis para Aluguel</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body style="background:#f8fafc; padding:2rem;">

    <div style="max-width: 1100px; margin: 0 auto;">
        <header style="text-align: center; margin-bottom: 2rem;">
            <h1 style="color:#0f172a; font-size: 2rem;">Acomodações <span style="color:#2563eb;">Disponíveis</span></h1>
            <p style="color:#64748b;">Encontre quartos e suítes no bairro de sua preferência</p>
        </header>

        <!-- Filtro por Bairro -->
        <div style="margin-bottom: 2rem; display:flex; justify-content:center; align-items:center; gap: 1rem;">
            <label style="font-weight:700; color:#475569;">Filtrar Bairro:</label>
            <select id="filter-bairro" onchange="loadCatalog()" class="input-month" style="width: 250px;">
                <option value="">Todos os Bairros</option>
            </select>
        </div>

        <!-- Grid do Catálogo -->
        <div id="catalog-container" class="rooms-grid"></div>
    </div>

    <script>
        // Configure aqui o número do WhatsApp de atendimento (Com DDD e 55)
        const WHATSAPP_NUMERO = "5561999999999"; 

        async function loadBairros() {
            try {
                const res = await fetch('api/quartos.php?action=bairros');
                const bairros = await res.json();
                const select = document.getElementById('filter-bairro');
                
                bairros.forEach(b => {
                    select.innerHTML += `<option value="${b}">${b}</option>`;
                });
            } catch (e) {
                console.error("Erro ao carregar bairros:", e);
            }
        }

        async function loadCatalog() {
            const bairro = document.getElementById('filter-bairro').value;
            const container = document.getElementById('catalog-container');
            container.innerHTML = '<p style="grid-column:1/-1; text-align:center; color:#94a3b8;">Buscando acomodações...</p>';

            try {
                const res = await fetch(`api/quartos.php?action=vitrine&bairro=${encodeURIComponent(bairro)}`);
                const quartos = await res.json();

                if (!quartos || quartos.length === 0) {
                    container.innerHTML = `<p style="grid-column:1/-1; text-align:center; color:#94a3b8; font-size:1.1rem; margin-top:2rem;">Nenhum quarto disponível para aluguel neste bairro no momento.</p>`;
                    return;
                }

                container.innerHTML = quartos.map(q => {
                    const preco = parseFloat(q.valor_base || 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
                    const foto = q.foto_url && q.foto_url.trim() !== '' ? q.foto_url : 'https://images.unsplash.com/photo-1522771739844-6a9f6d5f14af?auto=format&fit=crop&w=600&q=80';
                    const msgWhats = encodeURIComponent(`Olá! Vi o ${q.numero} (${q.tipo_mobilia}) no bairro ${q.bairro} por ${preco}/mês e gostaria de agendar uma visita.`);

                    return `
                        <div class="room-card" style="overflow:hidden; display:flex; flex-direction:column; justify-content:space-between;">
                            <div>
                                <img src="${foto}" alt="Foto da Acomodação" style="width:100%; height:200px; object-fit:cover;">
                                <div style="padding: 1rem;">
                                    <span class="badge badge-paid" style="margin-bottom:0.5rem; display:inline-block; font-size:0.75rem;">
                                        📍 ${q.bairro}
                                    </span>
                                    <h3 style="font-size:1.2rem; color:#0f172a;">${q.numero}</h3>
                                    <p style="font-size:0.85rem; color:#2563eb; font-weight:700; margin-bottom:0.5rem;">${q.tipo_mobilia}</p>
                                    <p style="font-size:0.85rem; color:#64748b;">${q.caracteristicas || 'Acomodação confortável com leitos disponíveis.'}</p>
                                </div>
                            </div>
                            <div style="padding:1rem; border-top:1px solid #f1f5f9; display:flex; justify-content:space-between; align-items:center; background:#fafafa;">
                                <div>
                                    <small style="color:#64748b; font-size:0.7rem; text-transform:uppercase; font-weight:700;">A partir de</small>
                                    <div style="font-size:1.2rem; font-weight:800; color:#059669;">${preco}</div>
                                </div>
                                <a href="https://wa.me/${WHATSAPP_NUMERO}?text=${msgWhats}" 
                                   target="_blank" 
                                   class="btn-primary" 
                                   style="text-decoration:none; background:#10b981; font-size:0.85rem; padding:0.5rem 0.8rem;">
                                    Falar no Whats
                                </a>
                            </div>
                        </div>
                    `;
                }).join('');
            } catch (e) {
                console.error("Erro ao carregar catálogo:", e);
                container.innerHTML = '<p style="grid-column:1/-1; text-align:center; color:#e11d48;">Erro ao carregar catálogo.</p>';
            }
        }

        document.addEventListener("DOMContentLoaded", () => {
            loadBairros();
            loadCatalog();
        });
    </script>
</body>
</html>
