<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pensionato Pro - Casas & Quartos</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- OVERLAY ESCURO -->
    <div id="sidebar-overlay" class="sidebar-overlay" onclick="toggleSidebar()"></div>

    <!-- TOPBAR COM MENU HAMBÚRGUER -->
    <div class="mobile-topbar">
        <button type="button" class="btn-hamburger" onclick="toggleSidebar()" aria-label="Abrir Menu">☰</button>
        <div class="brand" style="margin:0; font-size:1.1rem;">Pensionato <span class="brand-highlight">Pro</span></div>
    </div>

    <div class="layout-container">
        <!-- SIDEBAR RETRÁTIL -->
        <aside id="main-sidebar" class="sidebar-drawer">
            <div>
                <div class="brand" style="padding:1.25rem; display:flex; justify-content:space-between; align-items:center;">
                    <span>Pensionato <span class="brand-highlight">Pro</span></span>
                    <button type="button" onclick="toggleSidebar()" style="background:none; border:none; color:#94a3b8; font-size:1.5rem; cursor:pointer;">&times;</button>
                </div>
                <nav class="nav-list">
                    <a href="index.html" class="nav-btn">Dashboard</a>
                    <a href="quartos.html" class="nav-btn active">Casas & Quartos</a>
                    <a href="inquilinos.html" class="nav-btn">Inquilinos</a>
                    <a href="despesas.html" class="nav-btn">Contas & Rateio</a>
                    <a href="relatorios.html" class="nav-btn">Relatórios DRE</a>
                </nav>
            </div>
            <div class="sidebar-footer" style="padding:1.25rem;">
                <button onclick="DBService.logout()" class="btn-logout" style="width:100%;">Sair do Painel</button>
            </div>
        </aside>

        <main>
            <div class="header-title">
                <div>
                    <h2>Gestão de Casas & Imóveis</h2>
                    <p>Estrutura por Unidades, Quartos e Capacidade Total</p>
                </div>
                <div style="display:flex; gap:0.5rem;">
                    <button onclick="openModal('modal-casa')" class="btn-primary" style="background:#10b981;">+ Nova Casa</button>
                    <button onclick="openModal('modal-room')" class="btn-primary">+ Novo Quarto Geral</button>
                </div>
            </div>

            <!-- Lista de Casas e Quartos -->
            <div id="casas-container" style="display:flex; flex-direction:column; gap:2rem;"></div>
        </main>
    </div>

    <!-- Modal Cadastrar Casa -->
    <div id="modal-casa" class="modal-overlay">
        <div class="modal-card">
            <div class="modal-header"><span>Cadastrar Nova Casa</span><button type="button" onclick="closeModal('modal-casa')" class="btn-close">&times;</button></div>
            <form id="form-casa" onsubmit="handleCreateCasa(event)" class="modal-body" enctype="multipart/form-data">
                <div class="form-group"><label>Nome da Casa</label><input type="text" id="casa-nome" required class="form-control"></div>
                <div class="grid-2-form">
                    <div class="form-group"><label>Bairro</label><input type="text" id="casa-bairro" required class="form-control"></div>
                    <div class="form-group"><label>Endereço</label><input type="text" id="casa-endereco" class="form-control"></div>
                </div>
                <div class="form-group"><label>Foto da Casa (Upload)</label><input type="file" id="casa-foto-file" accept="image/*" class="form-control"></div>
                <div class="form-group"><label>Ou URL da Foto</label><input type="url" id="casa-foto-url" class="form-control"></div>
                <div class="modal-actions">
                    <button type="button" onclick="closeModal('modal-casa')" class="btn-secondary">Cancelar</button>
                    <button type="submit" class="btn-primary">Salvar Casa</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal Editar Casa -->
    <div id="modal-edit-casa" class="modal-overlay">
        <div class="modal-card">
            <div class="modal-header"><span>Editar Casa</span><button type="button" onclick="closeModal('modal-edit-casa')" class="btn-close">&times;</button></div>
            <form id="form-edit-casa" onsubmit="handleUpdateCasa(event)" class="modal-body" enctype="multipart/form-data">
                <input type="hidden" id="edit-casa-id">
                <div class="form-group"><label>Nome da Casa</label><input type="text" id="edit-casa-nome" required class="form-control"></div>
                <div class="grid-2-form">
                    <div class="form-group"><label>Bairro</label><input type="text" id="edit-casa-bairro" required class="form-control"></div>
                    <div class="form-group"><label>Endereço</label><input type="text" id="edit-casa-endereco" class="form-control"></div>
                </div>
                <div class="form-group"><label>Foto da Casa (Upload)</label><input type="file" id="edit-casa-foto-file" accept="image/*" class="form-control"></div>
                <div class="form-group"><label>Ou URL da Foto</label><input type="url" id="edit-casa-foto-url" class="form-control"></div>
                <div class="modal-actions">
                    <button type="button" onclick="closeModal('modal-edit-casa')" class="btn-secondary">Cancelar</button>
                    <button type="submit" class="btn-primary">Atualizar Casa</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal Novo Quarto -->
    <div id="modal-room" class="modal-overlay">
        <div class="modal-card">
            <div class="modal-header"><span>Cadastrar Novo Quarto</span><button type="button" onclick="closeModal('modal-room')" class="btn-close">&times;</button></div>
            <form id="form-room" onsubmit="handleCreateRoom(event)" class="modal-body" enctype="multipart/form-data">
                <div class="form-group"><label>Pertence à Casa</label><select id="room-casa-select" required class="form-control"></select></div>
                <div class="form-group"><label>Número / Nome</label><input type="text" id="room-number" required class="form-control"></div>
                <div class="grid-2-form">
                    <div class="form-group"><label>Andar</label><input type="text" id="room-floor" class="form-control"></div>
                    <div class="form-group"><label>Mobília</label><select id="room-tipo-mobilia" class="form-control"><option value="Suíte Completa">Suíte Completa</option><option value="Quarto Simples">Quarto Simples</option><option value="Quarto Duplo">Quarto Duplo</option></select></div>
                </div>
                <div class="grid-2-form">
                    <div class="form-group"><label>Valor Mensal (R$)</label><input type="number" step="0.01" id="room-valor-base" required class="form-control"></div>
                    <div class="form-group"><label>Qtd de Leitos</label><input type="number" id="room-beds" min="1" max="10" value="1" required class="form-control"></div>
                </div>
                <div class="form-group"><label>Foto Quarto (Upload)</label><input type="file" id="room-foto-file" accept="image/*" class="form-control"></div>
                <div class="form-group"><label>Ou URL da Foto</label><input type="url" id="room-foto-url" class="form-control"></div>
                <div class="form-group"><label>Características</label><input type="text" id="room-features" placeholder="Ar, Wi-Fi" class="form-control"></div>
                <div class="modal-actions">
                    <button type="button" onclick="closeModal('modal-room')" class="btn-secondary">Cancelar</button>
                    <button type="submit" class="btn-primary">Salvar Quarto</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal Editar Quarto -->
    <div id="modal-edit-room" class="modal-overlay">
        <div class="modal-card">
            <div class="modal-header"><span>Editar Quarto</span><button type="button" onclick="closeModal('modal-edit-room')" class="btn-close">&times;</button></div>
            <form id="form-edit-room" onsubmit="handleUpdateRoom(event)" class="modal-body" enctype="multipart/form-data">
                <input type="hidden" id="edit-room-id">
                <div class="form-group"><label>Pertence à Casa</label><select id="edit-room-casa-select" required class="form-control"></select></div>
                <div class="form-group"><label>Número / Nome</label><input type="text" id="edit-room-number" required class="form-control"></div>
                <div class="grid-2-form">
                    <div class="form-group"><label>Andar</label><input type="text" id="edit-room-floor" class="form-control"></div>
                    <div class="form-group"><label>Mobília</label><select id="edit-room-tipo-mobilia" class="form-control"><option value="Suíte Completa">Suíte Completa</option><option value="Quarto Simples">Quarto Simples</option><option value="Quarto Duplo">Quarto Duplo</option></select></div>
                </div>
                <div class="form-group"><label>Valor Mensal (R$)</label><input type="number" step="0.01" id="edit-room-valor-base" required class="form-control"></div>
                <div class="form-group"><label>Foto Quarto (Upload)</label><input type="file" id="edit-room-foto-file" accept="image/*" class="form-control"></div>
                <div class="form-group"><label>Ou URL da Foto</label><input type="url" id="edit-room-foto-url" class="form-control"></div>
                <div class="form-group"><label>Características</label><input type="text" id="edit-room-features" class="form-control"></div>
                <div class="modal-actions">
                    <button type="button" onclick="closeModal('modal-edit-room')" class="btn-secondary">Cancelar</button>
                    <button type="submit" class="btn-primary">Atualizar Quarto</button>
                </div>
            </form>
        </div>
    </div>

    <script src="js/state.js"></script>
    <script src="js/components.js"></script>
    <script src="js/app.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", async () => {
            DBService.checkAuth();
            await renderCasasEQuartos();
        });
    </script>
</body>
</html>
